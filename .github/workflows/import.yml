name: Import site from Cloudflare Pages

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/import.yml']

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if already imported
        id: check
        run: |
          if [ -f index.html ]; then echo "done=1" >> "$GITHUB_OUTPUT"; fi

      - name: Download original files (deployment c986d38d)
        if: steps.check.outputs.done != '1'
        run: |
          set -euo pipefail
          SRC=https://c986d38d.amk-nedra.pages.dev
          for f in index.html company.html contacts.html css/style.css js/main.js \
                   img/logo.png img/logo.svg \
                   img/photo/photo-1.jpg img/photo/photo-2.jpg img/photo/photo-3.jpg \
                   img/photo/photo-4.jpg img/photo/photo-5.jpg \
                   services/ekologiya.html services/geodeziya.html services/geologiya.html \
                   services/geotehnika.html services/gidrometeorologiya.html; do
            mkdir -p "$(dirname "$f")"
            curl -fsSL --retry 3 -o "$f" "$SRC/$f"
          done
          for f in img/*.png img/photo/*.jpg; do
            file -b --mime-type "$f" | grep -q '^image/' || { echo "Bad file: $f"; exit 1; }
          done
          ls -lR img css js services
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Импорт сайта с Cloudflare Pages (деплой c986d38d) без изменений"

      - name: Security and bug fixes
        if: steps.check.outputs.done != '1'
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import pathlib
          csp = ("default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; "
                 "img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; "
                 "base-uri 'self'; form-action 'self'; upgrade-insecure-requests")
          tag = ('  <meta http-equiv="Content-Security-Policy" content="' + csp + '">\n'
                 '  <meta name="referrer" content="strict-origin-when-cross-origin">\n')
          for p in pathlib.Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              t = p.read_text(encoding='utf-8')
              if 'Content-Security-Policy' not in t:
                  t = t.replace('<meta charset="UTF-8">\n', '<meta charset="UTF-8">\n' + tag, 1)
              if p.parent.name == 'services':
                  t = t.replace('<script src="js/main.js">', '<script src="../js/main.js">')
              p.write_text(t, encoding='utf-8')
              print('patched', p)
          EOF
          echo "amk-nedra.ru" > CNAME
          touch .nojekyll
          printf '# АМК «Недра»\n\nСайт ООО «Амурская компания «Недра» — https://amk-nedra.ru\n\nСтатический сайт, опубликован через GitHub Pages (ветка main, корень репозитория).\n' > README.md
          grep -c 'Content-Security-Policy' *.html services/*.html
          grep -H 'main.js' services/*.html
          git add -A
          git commit -m "Безопасность: CSP и referrer-policy, домен amk-nedra.ru в CNAME, исправлен путь к main.js на страницах услуг"
          git push
